spring:
  application:
    name: coding-shuttle-learning

  datasource:
    url:  jdbc:mysql://localhost:3306/coding_shuttle_learning?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        formate_sql: true

jwt.secret_key: ${JWT_SECRET_KEY}

server:
  port: 8080